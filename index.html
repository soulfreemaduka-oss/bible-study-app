
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Study App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6fb;
      color: #172033;
    }
    header {
      background: #092b63;
      color: white;
      text-align: center;
      padding: 24px 16px;
    }
    header h1 {
      margin: 0 0 8px;
    }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    button {
      background: #1555b8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
    }
    select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }
    .verse {
      font-size: 18px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <header>
    <h1>📖 Bible Study</h1>
    <p>Discover the Word in its original languages</p>
  </header>

  <main>
    <section class="card">
      <h2>Welcome</h2>
      <p>Study Scripture, explore Hebrew and Greek, and grow in understanding.</p>
    </section>

    <section class="card">
      <h2>Choose a Testament</h2>
      <select id="testament">
        <option value="old">Old Testament — Hebrew</option>
        <option value="new">New Testament — Greek</option>
      </select>
      <button onclick="showStudy()">Start Bible Study</button>
      <p id="result" class="verse">Your study will appear here.</p>
    </section>

    <section class="card">
      <h2>Study Tools</h2>
      <p>Next we will add Scripture reading, original-language words, word meanings, and offline access.</p>
    </section>
  </main>

  <script>
    function showStudy() {
      const testament = document.getElementById("testament").value;
      const result = document.getElementById("result");

      if (testament === "old") {
        result.textContent =
          "Old Testament selected. Hebrew study tools are coming next.";
      } else {
        result.textContent =
          "New Testament selected. Greek study tools are coming next.";
      }
    }
  </script>
</body>
</html>
